[project]
name = "mini-agent"
version = "0.17.0"
description = "A minimal agent."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Kowyo", email = "kowyo@outlook.com" }]
dependencies = [
    "anthropic>=0.111.0",
    "pillow>=12.2.0",
    "prompt-toolkit>=3.0.52",
    "pyobjc-framework-cocoa>=12.2.1 ; sys_platform == 'darwin'",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[project.scripts]
mini = "mini_agent:main"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PTH", "ANN", "SIM", "PT"]
ignore = ["E501"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov=src/mini_agent"
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"
