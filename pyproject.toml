[project]
name = "mini-agent"
version = "0.10.0"
description = "A minimal agent."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Kowyo", email = "kowyo@outlook.com" }]
dependencies = [
    "anthropic>=0.94.0",
    "pillow>=12.2.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.3",
    "prek>=0.3.9",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[project.scripts]
mini-agent = "mini_agent:main"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PTH", "ANN", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"
