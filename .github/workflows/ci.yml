name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.0.0

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "format --check --diff"

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
          - os: ubuntu-24.04-arm
            args: --wheel
          - os: windows-2025
            args: --wheel
          - os: windows-11-arm
            args: --wheel
          - os: macos-26-intel
            args: --wheel
          - os: macos-26
            args: --wheel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build ${{ matrix.args }}

      - name: Smoke test
        shell: bash
        run: uv run --with dist/*.whl --no-project python -c "from mini_agent import main"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create release and upload artifacts
        run: gh release create ${{ github.ref_name }} dist/* --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
