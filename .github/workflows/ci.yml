name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ruff check
        uses: astral-sh/ruff-action@v3

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate categorized release notes with installation
        run: |
          # Generate auto-categorized notes using .github/release.yml
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            -f target_commitish="${{ github.sha }}" \
            -q .body > release_notes.md

          # Append installation section
          cat >> release_notes.md << EOF

          ## Installation

          Install this version using uv:

          \`\`\`bash
          uv tool install git+https://github.com/kowyo/mini-agent.git@${{ github.ref_name }}
          \`\`\`
          EOF

          cat release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release and upload artifacts
        run: |
          gh release create ${{ github.ref_name }} dist/* \
            --latest \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
