name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version-file: "uv.toml"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.0.0

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "format --check --diff"

      - name: Type check
        run: uv run ty check src/

      - name: Run tests
        run: uv run pytest tests

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
          - os: ubuntu-24.04-arm
            args: --wheel
          - os: windows-2025
            args: --wheel
          - os: windows-11-arm
            args: --wheel
          - os: macos-26-intel
            args: --wheel
          - os: macos-26
            args: --wheel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version-file: "uv.toml"

      - name: Build
        run: uv build ${{ matrix.args }}

      - name: Smoke test
        shell: bash
        run: uv run --with dist/*.whl --no-project python -c "from mini_agent import main"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            # First release — list all commits
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          REPO_URL="https://github.com/${{ github.repository }}"
          echo "## What's Changed" > /tmp/notes.md
          echo "" >> /tmp/notes.md
          git log --no-decorate --first-parent --format="* %s ([%h]($REPO_URL/commit/%H))" \
            "$PREV_TAG".."${{ github.ref_name }}" \
            | grep -v 'chore: bump version' >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "**Full Changelog**: $REPO_URL/compare/${PREV_TAG}...${{ github.ref_name }}" >> /tmp/notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create release and upload artifacts
        run: gh release create ${{ github.ref_name }} dist/* --title "${{ github.ref_name }}" --notes-file /tmp/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
