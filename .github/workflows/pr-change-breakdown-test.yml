name: PR Change Overview Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  breakdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Update styled change overview comment from PR head
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {publish} = require('./.github/scripts/pr-change-breakdown.cjs');
            await publish({github, context, core});
